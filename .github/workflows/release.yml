name: Release
run-name: Release Windows x64 (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Save as a draft instead of publishing
        type: boolean
        default: false
      prerelease:
        description: Mark as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows-x64
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  release:
    name: Build and release Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the selected commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version and check the release target
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $versionMatch = [regex]::Match($manifest, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"')
          if (-not $versionMatch.Success) { throw 'Cannot read the package version.' }
          $version = $versionMatch.Groups[1].Value
          $tag = "v$version"

          $existingTag = & git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list Git tags.' }
          if ($existingTag) {
              $tagCommit = & git rev-parse "refs/tags/$tag^{commit}"
              if ($LASTEXITCODE -ne 0) { throw "Cannot resolve tag $tag." }
              if ($tagCommit -ne $env:GITHUB_SHA) {
                  throw "Tag $tag points to another commit. Bump Cargo.toml and Cargo.lock before releasing."
              }
          }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
              -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
              throw "Release $tag already exists. Use a new version, or remove an unfinished draft before retrying."
          }
          if ($response.StatusCode -ne 404) { throw "Cannot check the release (HTTP $($response.StatusCode))." }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "## MWB Rust $tag" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

      - name: Install the repository's pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            target/release
          key: windows-2022-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-2022-rust-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run library tests
        run: cargo test --no-default-features --lib --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # windows-2022 includes MSVC, Windows SDK, CMake, and WiX Toolset 3.14.
      - name: Build and validate MSI and portable packages
        run: ./scripts/build-release.ps1

      - name: Upload packages to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: mwb-${{ steps.version.outputs.tag }}-windows-x64
          path: |
            artifacts/mwb-${{ steps.version.outputs.tag }}-windows-x64.msi
            artifacts/mwb-${{ steps.version.outputs.tag }}-windows-x64.msi.sha256
            artifacts/mwb-${{ steps.version.outputs.tag }}-windows-x64-portable.zip
            artifacts/mwb-${{ steps.version.outputs.tag }}-windows-x64-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create the GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $prefix = "mwb-$env:RELEASE_TAG-windows-x64"
          $assets = @("$prefix.msi", "$prefix.msi.sha256", "$prefix-portable.zip", "$prefix-portable.zip.sha256")
          $assetPaths = @($assets | ForEach-Object {
              (Get-Item -LiteralPath (Join-Path artifacts $_) -ErrorAction Stop).FullName
          })
          $releaseArguments = @(
              'release', 'create', $env:RELEASE_TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--target', $env:GITHUB_SHA,
              '--title', "MWB Rust $env:RELEASE_TAG",
              '--generate-notes'
          ) + $assetPaths
          if ($env:RELEASE_DRAFT -eq 'true') { $releaseArguments += '--draft' }
          if ($env:RELEASE_PRERELEASE -eq 'true') { $releaseArguments += '--prerelease' }
          $releaseUrl = & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed.' }
          Write-Output $releaseUrl
          "Release: $releaseUrl" >> $env:GITHUB_STEP_SUMMARY
