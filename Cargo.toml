[package]
name = "mwb"
version = "0.4.0"
edition = "2024"
description = "A Windows-first keyboard and mouse sharing app built with Rust and GPUI Kit"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hex = "0.4"
arboard = { version = "3", default-features = false, features = ["image-data"] }
sha2 = "0.10.9"
gpui-kit = { version = "=0.8.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[[bin]]
name = "mwb"
path = "src/main.rs"
required-features = ["desktop"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
