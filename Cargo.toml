[package]
name = "mwb"
version = "0.5.9"
edition = "2024"
rust-version = "1.95"
default-run = "mwb"
description = "A Windows-first keyboard and mouse sharing app built with Rust and GPUI Kit"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hex = "0.4"
arboard = { version = "3", default-features = false, features = ["image-data"] }
sha2 = "0.10.9"
gpui-kit = { version = "=0.8.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_StationsAndDesktops", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[[bin]]
name = "mwb"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mwb-input-service"
path = "src/bin/input-service.rs"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
